[package]
name = "omega-notes"
version = "0.1.5"
description = "Um espaço local para guardar e organizar seus estudos"
authors = ["you"]
edition = "2021"

[lib]
name = "omega_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
uuid = { version = "1.27", features = ["v4", "v7"] }
