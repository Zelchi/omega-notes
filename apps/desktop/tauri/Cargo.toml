[package]
name = "omega-notes"
version = "0.4.8"
description = "Um espaço local para guardar e organizar seus estudos"
authors = ["you"]
edition = "2021"

[lib]
name = "omega_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Work around recurring rustc panics while reusing incremental development caches.
[profile.dev]
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
html5ever = "0.39"
portable-pty = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
uuid = { version = "1.27", features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-wayland-nvidia-quirk = "0.1.0"
