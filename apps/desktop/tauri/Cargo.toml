[package]
name = "omega-notes"
version = "0.5.0"
description = "Um espaço local para guardar e organizar seus estudos"
authors = ["you"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "omega_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Evita falhas recorrentes do rustc ao reutilizar caches incrementais de desenvolvimento.
[profile.dev]
incremental = false

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
html5ever = "0.39"
portable-pty = "0.9"
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon"] }
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-process = "=3.0.0-alpha.3"
uuid = { version = "1.27", features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11.4" }
gdk4-x11 = "0.11.4"
tauri-runtime-cef = "=3.0.0-alpha.6"
tauri-runtime = "=3.0.0-alpha.4"
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-runtime-wry = "=3.0.0-alpha.4"

[patch.crates-io]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }
