[package]
name = "omega-notes-tauri"
version = "0.6.2"
description = "Host Tauri do Ômega Notes para Windows"
authors = ["Ômega Notes"]
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omega-notes-backend = { path = "../../backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-ico", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
