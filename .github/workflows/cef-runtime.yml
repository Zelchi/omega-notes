name: Runtime CEF no Linux e Wry no Windows

on:
  workflow_dispatch:
  push:
    branches: [experiment/linux-cef-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm
            artifact: linux-packages
            path: |
              apps/desktop/tauri/target/release/bundle/deb/*
              apps/desktop/tauri/target/release/bundle/rpm/*
          - os: windows-2022
            bundles: nsis
            artifact: windows-installer
            path: apps/desktop/tauri/target/release/bundle/nsis/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/tauri -> target'
      - name: Dependências do CEF no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-4-dev librsvg2-dev patchelf libssl-dev xdg-utils rpm
      - name: Instalar dependências JavaScript
        run: yarn install --frozen-lockfile --non-interactive
      - name: Restaurar cache CEF pré-compilado
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-linux-x64-154.0.34-g14c5a08-chromium-154.0.8037.98
      - name: Compilar pacote de teste
        run: node scripts/tauri-cef.mjs build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Conferir os pacotes Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for package in apps/desktop/tauri/target/release/bundle/deb/*.deb; do
            dependencies="$(dpkg-deb -f "$package" Depends)"
            if [[ "$dependencies" =~ webkit2gtk ]]; then
              echo "Dependência WebKitGTK inesperada: $package"
              exit 1
            fi
            if [[ ! "$dependencies" =~ libgtk-4-1 || ! "$dependencies" =~ zenity ]]; then
              echo "Dependências GTK4 ou Zenity ausentes: $package"
              exit 1
            fi
            if [[ "$dependencies" =~ libgtk-3-0 ]]; then
              echo "::warning::O pacote declara GTK3 nos metadados do Tauri CLI, mas o executável CEF não pode carregar GTK3: $package"
            fi
            contents="$(dpkg-deb --contents "$package")"
            grep -q 'libcef.so' <<<"$contents"
            if ! grep -Eq '^-rwsr-xr-x.*chrome-sandbox' <<<"$contents"; then
              echo "Helper chrome-sandbox ausente ou sem setuid: $package"
              exit 1
            fi
          done
          for package in apps/desktop/tauri/target/release/bundle/rpm/*.rpm; do
            dependencies="$(rpm -qp --requires "$package")"
            if [[ "$dependencies" =~ webkit2gtk ]]; then
              echo "Dependência WebKitGTK inesperada: $package"
              exit 1
            fi
            if [[ ! "$dependencies" =~ gtk4 || ! "$dependencies" =~ zenity ]]; then
              echo "Dependências GTK4 ou Zenity ausentes: $package"
              exit 1
            fi
            if [[ "$dependencies" =~ gtk3 ]]; then
              echo "::warning::O pacote declara GTK3 nos metadados do Tauri CLI, mas o executável CEF não pode carregar GTK3: $package"
            fi
            contents="$(rpm -qplv "$package")"
            grep -q 'libcef.so' <<<"$contents"
            if ! grep -Eq '^-rwsr-xr-x.*chrome-sandbox' <<<"$contents"; then
              echo "Helper chrome-sandbox ausente ou sem setuid: $package"
              exit 1
            fi
          done
          cef_library="$(find apps/desktop/tauri/target/release -name libcef.so -type f -print -quit)"
          if [[ -z "$cef_library" ]]; then
            echo "libcef.so ausente no target de build"
            exit 1
          fi
          for binary in apps/desktop/tauri/target/release/omega-notes "$cef_library"; do
            linked_libraries="$(ldd "$binary")"
            if [[ "$linked_libraries" =~ "not found" ]]; then
              echo "Biblioteca dinâmica ausente para: $binary"
              exit 1
            fi
            if grep -Eq 'libwebkit2gtk|libgtk-3\.so' <<<"$linked_libraries"; then
              echo "Runtime WebKitGTK/GTK3 inesperado no binário: $binary"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7
