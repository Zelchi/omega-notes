name: Verificações de qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/tauri -> target'
      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-4-dev librsvg2-dev patchelf libssl-dev xdg-utils rpm
      - name: Restaurar cache CEF pré-compilado
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-linux-x64-154.0.34-g14c5a08-chromium-154.0.8037.98
      - name: Instalar dependências JavaScript
        run: yarn install --frozen-lockfile --non-interactive
      - name: Verificar tipos
        run: yarn typecheck
      - name: Testar desktop
        run: yarn test:desktop
      - name: Testar backend Tauri
        run: CEF_PATH="$HOME/.cache/tauri-cef" cargo test --locked --manifest-path apps/desktop/tauri/Cargo.toml
