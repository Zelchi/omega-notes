name: Publicar versão desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existente vX.Y.Z
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/bridge/tauri -> target
      - if: runner.os == 'Windows'
        run: cargo install tauri-cli --version 2.12.3 --locked
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn release:prepare
      - if: runner.os == 'Linux'
        run: yarn build:desktop:electron --linux deb rpm --x64 --publish never
      - if: runner.os == 'Windows'
        run: yarn build:desktop:tauri --ci --config tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_PASSWORD }}
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installers-Linux
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installers-Windows
          path: |
            apps/desktop/bridge/tauri/target/release/bundle/nsis/*.exe
            apps/desktop/bridge/tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: yarn release:prepare
      - run: cargo build --release --locked --manifest-path apps/desktop/backend/Cargo.toml
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Assinar, verificar e montar manifesto
        run: node scripts/desktop-release.mjs sign release-assets
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_PASSWORD }}
      - name: Publicar release completa
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            test "$draft" = true || { echo 'Crie uma nova versão; esta release já está publicada.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Ômega Notes $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*.deb release-assets/*.rpm release-assets/*.exe release-assets/*.sig release-assets/native-latest.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
