name: Publicar versão

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente, por exemplo v0.1.5'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir versão e configuração
        run: node scripts/prepare-release.mjs
      - name: Conferir assinatura
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e 'if (!process.env.SIGNING_KEY) throw new Error("Cadastre TAURI_SIGNING_PRIVATE_KEY nos secrets do GitHub.")'
      - name: Preparar release em rascunho
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const changelog = require('node:fs').readFileSync('changelog.md', 'utf8');
            const heading = `## ${tag}`;
            const lines = changelog.split(/\r?\n/);
            const start = lines.indexOf(heading);
            if (start < 0) throw new Error(`Notas de atualização ausentes para ${tag}.`);
            const next = lines.findIndex((line, index) => index > start && line.startsWith('## '));
            const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
            if (!notes) throw new Error(`Notas de atualização vazias para ${tag}.`);
            const body = `${notes}\n\n---\n\nWindows 10/11: instalador .exe. Ubuntu: pacote .deb. Fedora: pacote .rpm. Arquitetura x64.`;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) throw new Error('Esta versão já está publicada. Crie uma nova tag.');
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Ômega Notes ${tag}`,
                draft: true, prerelease: false,
                body,
              })).data;
            } else {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
            }
            return release.id;

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # O manifesto agrega os pacotes nativos Linux e o instalador Windows.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm
          - os: windows-2022
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri -> target'
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Instalar dependências
        run: yarn install --frozen-lockfile
      - name: Configurar a fonte de atualizações
        run: node scripts/prepare-release.mjs
      - name: Compilar, assinar e enviar instaladores
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: '.'
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }} --config tauri/tauri.release.conf.json -- --locked

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Validar os três instaladores e publicar
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            const manifest = assets.find((asset) => asset.name === 'latest.json');
            if (!manifest) throw new Error('latest.json não foi gerado.');
            const response = await fetch(manifest.url, {
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/octet-stream' },
            });
            if (!response.ok) throw new Error('Não foi possível ler latest.json.');
            const data = await response.json();
            if (data.version.replace(/^v/, '') !== process.env.RELEASE_TAG.slice(1)) throw new Error('Versão do manifesto incorreta.');
            for (const platform of ['linux-x86_64-deb', 'linux-x86_64-rpm', 'windows-x86_64-nsis']) {
              const artifact = data.platforms?.[platform];
              if (!artifact?.signature || !artifact?.url) throw new Error(`Atualização incompleta para ${platform}.`);
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });
